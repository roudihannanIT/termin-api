name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: termin
          POSTGRES_PASSWORD: termin
          POSTGRES_DB: termin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U termin -d termin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://termin:termin@localhost:5432/termin_test?schema=public
      JWT_SECRET: ci-only-secret-key-that-is-at-least-32-characters-long
      PORT: 3000

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Apply migrations
        run: npx prisma migrate deploy

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test