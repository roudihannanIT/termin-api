services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: termin
      POSTGRES_PASSWORD: termin
      POSTGRES_DB: termin
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U termin -d termin"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: